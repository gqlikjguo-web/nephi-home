databases:
  - name: nephi-home-node-pilot-db
    databaseName: nephi_home_node_pilot
    user: nephi_home_node_pilot
    region: singapore
    plan: basic-256mb
    diskSizeGB: 1
    ipAllowList: []

services:
  - type: web
    name: nephi-home-node-pilot-test-only
    runtime: node
    region: singapore
    plan: starter
    rootDir: pilot/nephi-home-node-pilot-v1
    buildCommand: npm install --omit=dev
    startCommand: npm run migrate:postgres && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nephi-home-node-pilot-db
          property: connectionString
      - key: NEPHI_PILOT_HOST
        value: 0.0.0.0
      - key: NEPHI_PILOT_TIME_ZONE
        value: Asia/Taipei
      - key: TEST_ONLY_ENVIRONMENT
        value: "true"
      - key: TEST_ONLY_ACCEPTANCE_ENABLED
        value: "true"
      - key: NEPHI_PILOT_CLASSIFIER_TIMEOUT_MS
        value: "15000"
      - key: PUBLIC_BASE_URL
        value: https://nephi-home-node-pilot-test-only-btye.onrender.com
      - key: ONBOARDING_EMAIL_FROM
        value: JunZan AI <noreply@junzanai.com>
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_TEST_API_KEY
        sync: false
      - key: OPENAI_TEST_MODEL
        sync: false
      - key: NEPHI_PILOT_LINE_CHANNEL_SECRET
        sync: false
      - key: NEPHI_PILOT_LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: JUNZAN_LINE_CREDENTIAL_ENCRYPTION_KEY
        sync: false

  - type: web
    name: nephi-home-junzan-line-gateway-test
    runtime: node
    branch: test-only/node-pilot-integration
    rootDir: pilot/junzan-line-gateway-v1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PROPERTY_ID
        value: nephi_home
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_TEST_API_KEY
        sync: false
      - key: OPENAI_TEST_MODEL
        sync: false
