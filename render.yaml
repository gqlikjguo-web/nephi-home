databases:
  - name: nephi-home-node-pilot-db
    databaseName: nephi_home_node_pilot
    user: nephi_home_node_pilot
    region: singapore
    plan: basic-256mb
    diskSizeGB: 1
    ipAllowList: []

services:
  - type: web
    name: nephi-home-node-pilot-test-only
    runtime: node
    region: singapore
    plan: starter
    rootDir: pilot/nephi-home-node-pilot-v1
    buildCommand: npm install --omit=dev
    startCommand: npm run migrate:postgres && npm run seed:postgres && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nephi-home-node-pilot-db
          property: connectionString
      - key: NEPHI_PILOT_HOST
        value: 0.0.0.0
      - key: NEPHI_PILOT_TIME_ZONE
        value: Asia/Taipei
      - key: NEPHI_PILOT_CLASSIFIER_TIMEOUT_MS
        value: "15000"
      - key: PUBLIC_BASE_URL
        value: https://app.junzanai.com
      - key: ONBOARDING_EMAIL_FROM
        value: JunZan AI <noreply@junzanai.com>
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_TEST_API_KEY
        sync: false
      - key: OPENAI_TEST_MODEL
        sync: false
      - key: NEPHI_PILOT_LINE_CHANNEL_SECRET
        sync: false
      - key: NEPHI_PILOT_LINE_CHANNEL_ACCESS_TOKEN
        sync: false
