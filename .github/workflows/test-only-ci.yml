name: test-only-ci

on:
  push:
    branches: [test-only/node-pilot-integration]
  pull_request:
    branches: [test-only/node-pilot-integration]
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Deployed acceptance mode
        required: true
        type: choice
        options:
          - target_preflight
          - full_matrix

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pilot/nephi-home-node-pilot-v1/package-lock.json
      - run: npm ci
      - run: npm run test:line-message-trace
      - run: node tests/v2-runtime-uniqueness-runner.js
      - run: node tests/junzan-ai-constitution-contract-runner.js
      - run: node tests/v1-golden-acceptance-matrix-runner.js
      - run: node tests/conversation-engine-v2-runner.js
      - run: node tests/v2-live-availability-regression-runner.js
      - run: node tests/conversation-engine-v2-integration-runner.js
      - run: npm test

  deployed-acceptance:
    if: github.event_name == 'workflow_dispatch' && always() && needs.verify.result == 'skipped' || github.event_name == 'push' && always() && needs.verify.result == 'success' && contains(github.event.head_commit.message, '[target-preflight]')
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_MODE: ${{ github.event_name == 'push' && 'target_preflight' || inputs.acceptance_mode }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed test-only conversation matrix
        env:
          TEST_ONLY_ACCEPTANCE_BASE_URL: https://nephi-home-node-pilot-test-only-btye.onrender.com
          TEST_ONLY_ACCEPTANCE_PROPERTY_ID: nephi_home
          TEST_ONLY_ACCEPTANCE_MODE: ${{ env.ACCEPTANCE_MODE }}
          TEST_ONLY_ACCEPTANCE_CASE_IDS: ${{ env.ACCEPTANCE_MODE == 'target_preflight' && 'rg-026-ktv-availability,rg-037-multi-pool-price-checkin' || '' }}
          TEST_ONLY_ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
        run: node scripts/run-deployed-conversation-acceptance.js
      - name: Upload private deployed acceptance report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: junzan-${{ inputs.acceptance_mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload private target preflight report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: junzan-target_preflight-${{ github.sha }}
          path: ${{ runner.temp }}/junzan-target_preflight-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
