name: test-only-ci

on:
  push:
    branches: [test-only/node-pilot-integration]
  pull_request:
    branches: [test-only/node-pilot-integration]
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Deployed acceptance mode
        required: true
        type: choice
        options:
          - target_preflight
          - full_matrix
          - operational_snapshot

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pilot/nephi-home-node-pilot-v1/package-lock.json
      - run: npm ci
      - run: npm run test:line-message-trace
      - run: node tests/v2-runtime-uniqueness-runner.js
      - run: node tests/junzan-ai-constitution-contract-runner.js
      - run: node tests/v1-golden-acceptance-matrix-runner.js
      - run: node tests/conversation-engine-v2-runner.js
      - run: node tests/v2-live-availability-regression-runner.js
      - run: node tests/conversation-engine-v2-integration-runner.js
      - run: npm test

  deployed-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode != 'operational_snapshot' && always() && needs.verify.result == 'skipped' || github.event_name == 'push' && always() && needs.verify.result == 'success' && (contains(github.event.head_commit.message, '[target-preflight]') || contains(github.event.head_commit.message, '[full-matrix]'))
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[full-matrix]') && 'full_matrix' || github.event_name == 'push' && 'target_preflight' || inputs.acceptance_mode }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed test-only conversation matrix
        env:
          TEST_ONLY_ACCEPTANCE_BASE_URL: https://nephi-home-node-pilot-test-only-btye.onrender.com
          TEST_ONLY_ACCEPTANCE_PROPERTY_ID: nephi_home
          TEST_ONLY_ACCEPTANCE_MODE: ${{ env.ACCEPTANCE_MODE }}
          TEST_ONLY_ACCEPTANCE_DATA_MODE: operational_read_only
          TEST_ONLY_ACCEPTANCE_CASE_IDS: ${{ env.ACCEPTANCE_MODE == 'target_preflight' && 'rg-003-price-nights,rg-004-bundle-price,rg-006-named-room-availability,rg-013-booking-request-full,rg-023-pool-fee,rg-029-checkin-latest,rg-033-kitchen,rg-037-multi-pool-price-checkin,rg-038-conversation-room-price-payment,rg-039-conversation-booking-refund,rgs-003-bbq,rgs-005-parking,rgs-010-pets,rgs-014-bundle-price,rgs-019-modify-room-mix,rgs-020-modify-date' || '' }}
          TEST_ONLY_ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
        run: node scripts/run-deployed-conversation-acceptance.js
      - name: Upload private deployed acceptance report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: junzan-${{ inputs.acceptance_mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload private push acceptance report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
          path: ${{ runner.temp }}/junzan-${{ env.ACCEPTANCE_MODE }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  operational-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'operational_snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download redacted operational PostgreSQL snapshot
        env:
          TEST_ONLY_ACCEPTANCE_BASE_URL: https://nephi-home-node-pilot-test-only-btye.onrender.com
          TEST_ONLY_ACCEPTANCE_PROPERTY_ID: nephi_home
          TEST_ONLY_OPERATIONAL_SNAPSHOT_REPORT_DIR: ${{ runner.temp }}/junzan-operational-snapshot-${{ github.sha }}
        run: node scripts/download-operational-snapshot.js
      - name: Upload private operational snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junzan-operational-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/junzan-operational-snapshot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
