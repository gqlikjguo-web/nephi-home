name: Core Reliability
on:
  pull_request_target:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.scope.outputs.digest }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            const crypto = require('crypto');
            const pr = context.payload.pull_request;
            if (Number(context.runAttempt) !== 1) throw Error('Repeated release attempts are not accepted; preserve the failed run');
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'production'});
            if (branch.commit.sha !== pr.base.sha) throw Error('Production baseline changed');
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) throw Error('Trusted same-repository candidate required');
            const {data} = await github.rest.repos.getContent({...context.repo, path: '.github/core-reliability-task.json', ref: pr.head.sha});
            const task = JSON.parse(Buffer.from(data.content, 'base64').toString());
            if (task.baseline !== pr.base.sha) throw Error('Task baseline must equal the current PR production base');
            const digest = crypto.createHash('sha256').update(JSON.stringify(task)).digest('hex');
            core.setOutput('digest', digest);
            await core.summary.addHeading('Approve this exact candidate scope')
              .addRaw('Candidate: ' + pr.head.sha + '\nBaseline: ' + pr.base.sha + '\nScope digest: ' + digest + '\n')
              .addCodeBlock(JSON.stringify(task, null, 2), 'json').write();
  gate:
    name: Core Reliability Gate
    needs: scope
    environment: core-scope-approval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gate_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: junzan_core_gate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gate_test -d junzan_core_gate"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Require installed trusted gate
        run: test -f trusted/pilot/nephi-home-node-pilot-v1/scripts/core-reliability-gate.js
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: candidate/pilot/nephi-home-node-pilot-v1
      - name: Run trusted scope, contract, incident, affected and release checks
        env:
          BASELINE: ${{ github.event.pull_request.base.sha }}
          CANDIDATE: ${{ github.event.pull_request.head.sha }}
          SCOPE_DIGEST: ${{ needs.scope.outputs.digest }}
          CORE_GATE_REAL_APPROVED: 'true'
          CORE_GATE_OPENAI_API_KEY: ${{ secrets.CORE_GATE_OPENAI_API_KEY }}
          CORE_GATE_DATABASE_URL: postgres://gate_test:isolated_ci_only@127.0.0.1:5432/junzan_core_gate
        run: >-
          node trusted/pilot/nephi-home-node-pilot-v1/scripts/core-reliability-gate.js
          --root candidate --baseline "$BASELINE" --candidate "$CANDIDATE"
          --approved-scope-digest "$SCOPE_DIGEST" --evidence "$RUNNER_TEMP/core-reliability"
      - name: Preserve evidence on success or STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reliability-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/core-reliability
          if-no-files-found: error
          retention-days: 30
  candidate-status:
    if: always()
    needs: [scope, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'production'});
            const passed = process.env.SCOPE_RESULT === 'success' && process.env.GATE_RESULT === 'success'
              && current.head.sha === pr.head.sha && branch.commit.sha === pr.base.sha
              && Number(context.runAttempt) === 1;
            await github.rest.repos.createCommitStatus({...context.repo, sha: pr.head.sha,
              state: passed ? 'success' : 'failure', context: 'Core Reliability Gate / candidate',
              description: passed ? 'Scope and required evidence verified for this SHA' : 'STOP: failure, blocked evidence, repeated run or stale SHA',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
