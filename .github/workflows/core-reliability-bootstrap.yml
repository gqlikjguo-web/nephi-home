name: Core Reliability first installation
on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
# This entry cannot run after production advances past the pre-installation base.
# It invokes the reviewed Gate, not an alternative verification implementation.
jobs:
  scope:
    if: github.event.pull_request.number == 1 && github.event.pull_request.base.sha == '8f1719c71dd590d85e9a4d1b47f1f08bb8a4af70'
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.scope.outputs.candidate }}
      baseline: ${{ steps.scope.outputs.baseline }}
      digest: ${{ steps.scope.outputs.digest }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            const assert = (ok, reason) => { if (!ok) throw Error('BOOTSTRAP_' + reason); };
            const base = '8f1719c71dd590d85e9a4d1b47f1f08bb8a4af70';
            const approvedDigest = 'e495b5721db45b992264ee6d5647e632d81491b3bc4bca36fe913db450aa0704';
            const pr = context.payload.pull_request;
            assert(context.repo.owner + '/' + context.repo.repo === 'gqlikjguo-web/nephi-home', 'REPOSITORY');
            assert(pr.number === 1 && pr.state === 'open' && !pr.draft && !pr.merged, 'PR_NOT_READY');
            assert(pr.base.ref === 'production' && pr.base.sha === base, 'BASE');
            assert(pr.head.ref === 'chore/core-reliability-gate-20260920' && pr.head.repo.full_name === 'gqlikjguo-web/nephi-home', 'HEAD_BRANCH');
            assert(/^[a-f0-9]{40}$/.test(pr.head.sha), 'CANDIDATE_SHA');
            assert(Number(process.env.GITHUB_RUN_ATTEMPT) === 1, 'REPEATED_ATTEMPT');
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: 1});
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'production'});
            assert(current.state === 'open' && !current.draft && !current.merged && current.head.sha === pr.head.sha && current.base.sha === base && branch.commit.sha === base, 'STALE_CANDIDATE');
            const {data} = await github.rest.repos.getContent({...context.repo, path: '.github/core-reliability-task.json', ref: pr.head.sha});
            const task = JSON.parse(Buffer.from(data.content, 'base64').toString());
            const digest = require('crypto').createHash('sha256').update(JSON.stringify(task)).digest('hex');
            assert(digest === approvedDigest && task.baseline === base && task.contractChangeAllowed === false, 'UNAPPROVED_SCOPE');
            core.setOutput('candidate', pr.head.sha);
            core.setOutput('baseline', base);
            core.setOutput('digest', digest);
            await core.summary.addHeading('One-time installation: approve this exact scope and SHA')
              .addRaw('Candidate: ' + pr.head.sha + '\nBase: ' + base + '\nReviewed Gate: e3b590adcc27d729f0d04c87bffb9bd163921428\n')
              .addCodeBlock(JSON.stringify(task, null, 2), 'json').write();
  gate:
    needs: scope
    environment: core-scope-approval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b590adcc27d729f0d04c87bffb9bd163921428
          path: reviewed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check approved bootstrap-only changes
        env:
          CANDIDATE: ${{ needs.scope.outputs.candidate }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const gate = require('./reviewed/pilot/nephi-home-node-pilot-v1/scripts/core-reliability-gate.js');
          const allowed = ['.github/core-reliability-task.json', '.github/workflows/core-reliability-bootstrap.yml', 'pilot/nephi-home-node-pilot-v1/tests/core-reliability-bootstrap-runner.js'];
          const changed = gate.changedPaths(path.resolve('candidate'), 'e3b590adcc27d729f0d04c87bffb9bd163921428', process.env.CANDIDATE);
          assert.ok(changed.length > 0 && changed.every(p => allowed.includes(p)), 'BOOTSTRAP_OUTSIDE_APPROVED_CHANGE');
          gate.verifyCheckout(path.resolve('candidate'), process.env.CANDIDATE);
          NODE
      - run: npm ci --ignore-scripts
        working-directory: candidate/pilot/nephi-home-node-pilot-v1
      - name: Verify bootstrap positive and negative cases
        run: node tests/core-reliability-bootstrap-runner.js
        working-directory: candidate/pilot/nephi-home-node-pilot-v1
      - name: Run the reviewed Gate and all 109 required regressions
        env:
          BASELINE: ${{ needs.scope.outputs.baseline }}
          CANDIDATE: ${{ needs.scope.outputs.candidate }}
          SCOPE_DIGEST: ${{ needs.scope.outputs.digest }}
        run: >-
          node reviewed/pilot/nephi-home-node-pilot-v1/scripts/core-reliability-gate.js
          --root candidate --baseline "$BASELINE" --candidate "$CANDIDATE"
          --approved-scope-digest "$SCOPE_DIGEST"
          --bootstrap-policy reviewed/.github/core-reliability-policy.json
          --bootstrap-policy-digest 35a9d7fdc33a938e3ef569ad3c2ea227ab8841ed4174a88cdc53a0912fd648e3
          --evidence "$RUNNER_TEMP/core-reliability-bootstrap"
      - name: Verify complete candidate-bound report
        env:
          CANDIDATE: ${{ needs.scope.outputs.candidate }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-reliability-bootstrap/report.json'));
          assert.equal(report.status, 'PASS');
          assert.equal(report.candidateSha, process.env.CANDIDATE);
          assert.equal(report.results.length, 109);
          assert.equal(report.coreChanged, false);
          assert.equal(report.realE2eRequired, false);
          NODE
      - name: Preserve evidence on success or STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reliability-bootstrap-${{ needs.scope.outputs.candidate }}
          path: ${{ runner.temp }}/core-reliability-bootstrap
          if-no-files-found: error
          retention-days: 30
  candidate-status:
    if: always() && github.event.pull_request.number == 1 && github.event.pull_request.base.sha == '8f1719c71dd590d85e9a4d1b47f1f08bb8a4af70'
    needs: [scope, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = '8f1719c71dd590d85e9a4d1b47f1f08bb8a4af70';
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'production'});
            const passed = process.env.SCOPE_RESULT === 'success' && process.env.GATE_RESULT === 'success'
              && Number(process.env.GITHUB_RUN_ATTEMPT) === 1 && pr.number === 1
              && current.state === 'open' && !current.draft && !current.merged
              && current.head.sha === pr.head.sha && current.base.sha === base && branch.commit.sha === base;
            await github.rest.repos.createCommitStatus({...context.repo, sha: pr.head.sha,
              state: passed ? 'success' : 'failure', context: 'Core Reliability Gate / candidate',
              description: passed ? 'Reviewed bootstrap Gate passed for this exact SHA' : 'STOP: bootstrap failed, incomplete, stale or repeated',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
