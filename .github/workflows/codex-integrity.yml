name: codex-integrity

on:
  push:
    branches: ["codex/**"]
  pull_request:

jobs:
  verify-codex-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codex_admin_test
          POSTGRES_USER: codex_test
          POSTGRES_PASSWORD: codex_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_test -d codex_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: pilot/nephi-home-node-pilot-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pilot/nephi-home-node-pilot-v1/package-lock.json
      - run: npm ci
      - run: npm run verify:protected-acceptance
      - run: node tests/verify-protected-acceptance-runner.js
      - run: npm run verify:codex-integrity
      - run: node tests/verify-codex-integrity-runner.js
      - run: npm run test:canonical-golden
      - run: npm run test:runtime-uniqueness
      - run: npm run test:provider-fail-closed
      - run: npm run test:custom-replies
        env:
          CUSTOM_REPLY_TEST_DATABASE_URL: postgresql://codex_test:codex_test_password@localhost:5432/codex_admin_test
      - run: npm test
        env:
          CUSTOM_REPLY_TEST_DATABASE_URL: postgresql://codex_test:codex_test_password@localhost:5432/codex_admin_test
      - run: node tests/test-only-conversation-acceptance-api-runner.js
      - run: node tests/planner-boundary-contract-runner.js
      - run: node tests/canonical-request-contract-runner.js
      - run: node tests/conversation-state-v3-runtime-reducer-runner.js
      - run: node tests/planner-failure-safety-runner.js
      - run: node tests/planner-semantic-contract-runner.js
      - run: node tests/v2-runtime-uniqueness-runner.js
      - run: node tests/final-decision-contract-runner.js
      - run: node tests/pending-arbitration-contract-runner.js
      - run: node tests/dialogue-temporal-state-contract-runner.js
      - run: node tests/relative-date-availability-runner.js
      - run: node tests/property-line-binding-runner.js
      - run: node tests/property-line-binding-postgres-webhook-runner.js
      - run: node tests/property-line-setup-runner.js
      - run: node tests/postgres-worker-smoke-runner.js
