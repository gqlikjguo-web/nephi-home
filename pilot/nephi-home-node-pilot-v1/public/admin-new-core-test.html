<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JunZan AI 新核心測試</title><link rel="stylesheet" href="/assets/admin-new-core-test.css"></head><body>
<main><header><h1>JunZan AI 新核心測試</h1><p>Property：尼腓的家　 Model：gpt-5.6-luna　 Mode：人工測試／不送 LINE</p><button id="newConversation">開始新對話</button></header>
<section id="chat" aria-live="polite"></section><form id="composer"><label for="input">客人訊息</label><textarea id="input" maxlength="1000" required></textarea><button>送出</button></form>
<section><h2>測試紀錄</h2><select id="filter"><option value="all">全部</option><option value="problem">有問題</option><option value="unmarked">未標記</option></select><div id="records"></div></section></main>
<template id="turnTemplate"><article class="turn"><p class="input"></p><div class="response"></div><details><summary>查看診斷</summary><pre class="diagnostic"></pre></details><div class="review"><button data-status="CORRECT">正確</button><button data-status="PROBLEM">有問題</button><select class="category"><option value="">選擇問題</option><option>Luna理解錯</option><option>回覆內容錯</option><option>不該回卻回了</option><option>該回卻沒回</option><option>應該追問</option><option>不該轉人工</option><option>應該轉人工</option><option>Context承接錯</option><option>日期錯</option><option>房型/包棟錯</option><option>房價錯</option><option>房況錯</option><option>設備/政策資料錯</option><option>其他</option></select><input class="note" maxlength="500" placeholder="備註"></div></article></template>
<script src="/assets/admin-new-core-test.js" defer></script></body></html>
