<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PUBLIC_BRAND_NAME}}｜建立業者後台密碼</title><link rel="stylesheet" href="/assets/onboarding.css"></head><body data-public-base-url="{{PUBLIC_BASE_URL}}"><main><header><p>{{PUBLIC_BRAND_NAME}}</p></header><section><h1>建立業者後台密碼</h1><form id="setup"><label>一次性邀請碼<input name="token" required></label><label>新密碼（至少 12 字元）<input name="password" type="password" minlength="12" required></label><button>建立帳號</button><p id="message"></p></form></section><footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer></main><script>const f=document.querySelector('#setup'),m=document.querySelector('#message');const t=new URLSearchParams(location.search).get('token');if(t)f.token.value=t;f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),j=await r.json();m.textContent=r.ok?'帳號已建立，現在可前往業者後台登入。':(j.error&&j.error.message||'建立失敗')};</script></body></html>
