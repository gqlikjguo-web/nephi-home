<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PUBLIC_BRAND_NAME}}｜建立業者後台登入</title>
  <link rel="stylesheet" href="/assets/onboarding.css">
</head>
<body data-public-base-url="{{PUBLIC_BASE_URL}}">
  <main>
    <header><p>{{PUBLIC_BRAND_NAME}}</p></header>
    <section>
      <h1>建立業者後台登入</h1>
      <p id="invitation-status">正在確認邀請資料…</p>
      <form id="setup" hidden>
        <input name="token" type="hidden">
        <p id="invitation-summary"></p>
        <label id="password-field">新密碼（8–12 字元）<span class="password-field"><input id="setupPassword" name="password" type="password" minlength="8" maxlength="12" autocomplete="new-password"><button type="button" data-password-toggle="setupPassword" aria-label="顯示新密碼">顯示</button></span></label>
        <label id="confirm-password-field">再次輸入新密碼<span class="password-field"><input id="setupConfirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="12" autocomplete="new-password"><button type="button" data-password-toggle="setupConfirmPassword" aria-label="顯示再次輸入新密碼">顯示</button></span></label>
        <button id="submit-button">建立 Email 登入</button>
        <p id="message" aria-live="polite"></p>
      </form>
    </section>
    <footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer>
  </main>
  <script>
    const form=document.querySelector("#setup"),message=document.querySelector("#message"),status=document.querySelector("#invitation-status"),summary=document.querySelector("#invitation-summary"),passwordField=document.querySelector("#password-field"),confirmPasswordField=document.querySelector("#confirm-password-field"),passwordInput=form.password,confirmPasswordInput=form.confirmPassword,submitButton=document.querySelector("#submit-button"),token=new URLSearchParams(location.search).get("token")||"";
    let existingIdentity=false;
    async function readPayload(response){try{return await response.json();}catch{return null;}}
    async function loadInvitation(){if(!token){status.textContent="邀請連結無效或已使用。";return;}try{const response=await fetch(`/api/admin/setup-invitation?token=${encodeURIComponent(token)}`),payload=await readPayload(response);if(!response.ok)throw new Error(payload&&payload.error&&payload.error.message||"邀請連結無效或已使用。");const invitation=payload.data;existingIdentity=invitation.existingIdentity===true;form.token.value=token;summary.textContent=`旅宿：${invitation.propertyName}｜登入 Email：${invitation.email}`;passwordField.hidden=confirmPasswordField.hidden=existingIdentity;passwordInput.required=confirmPasswordInput.required=!existingIdentity;submitButton.textContent=existingIdentity?"新增旅宿管理權限":"建立 Email 登入";status.textContent=existingIdentity?"此 Email 已有登入帳號。完成後請繼續使用原密碼登入；不會重設密碼。":"請設定此 Email identity 的登入密碼。";form.hidden=false;}catch(error){status.textContent=error.message||"無法確認邀請資料，請稍後再試。";}}
    form.onsubmit=async event=>{event.preventDefault();submitButton.disabled=true;message.textContent="處理中…";try{const body={token,...(!existingIdentity?{password:passwordInput.value,confirmPassword:confirmPasswordInput.value}:{})},response=await fetch("/api/admin/setup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}),payload=await readPayload(response);if(!response.ok)throw new Error(payload&&payload.error&&payload.error.message||"建立失敗，請稍後再試。");message.textContent=payload.data.existingIdentity?"旅宿管理權限已新增。請使用原本的 Email 與原密碼登入。":"Email 登入已建立，現在可前往業者後台登入。";form.querySelectorAll("input,button").forEach(element=>element.disabled=true);}catch(error){message.textContent=error.message||"建立失敗，請稍後再試。";submitButton.disabled=false;}};
    document.querySelectorAll("[data-password-toggle]").forEach(button=>{button.onclick=()=>{const input=document.getElementById(button.dataset.passwordToggle);input.type=input.type==="password"?"text":"password";button.textContent=input.type==="password"?"顯示":"隱藏";};});
    loadInvitation();
  </script>
</body>
</html>
