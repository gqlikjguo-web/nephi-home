<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PUBLIC_BRAND_NAME}}｜旅客查房</title><link rel="stylesheet" href="/assets/guest.css"></head>
<body><main class="guest-shell"><header><p class="eyebrow">{{PUBLIC_BRAND_NAME}}</p><h1 id="propertyName">旅客查房</h1></header>
<div class="guest-layout"><section class="card search-card"><form id="searchForm"><div class="search-grid"><label>入住日期<input id="checkIn" name="checkIn" type="date" required></label><label>退房日期<input id="checkOut" name="checkOut" type="date" required></label><label class="guest-count">入住人數（可不填）<span><input name="guests" type="number" min="1" max="50" inputmode="numeric" placeholder="例如：2"><b>人</b></span></label><label>想查什麼？<select id="inventoryChoice" name="inventoryChoice" disabled><option value="all">載入中</option></select></label></div><button type="submit">查詢</button></form><p id="message" class="message" role="status"></p></section>
<section id="results" class="card results-card" hidden><h2>查詢結果</h2><p id="stayDates" class="stay-dates"></p><div id="roomResults"></div><div id="bundleResults"></div><p id="lineUnavailable" class="line-unavailable" hidden>此旅宿尚未提供 LINE 加好友網址，請使用旅宿公布的其他方式聯絡。</p><p id="lineDisclaimer" class="line-disclaimer" hidden>將開啟此旅宿正式 LINE 聯絡頁面。</p></section></div>
</main><script src="/assets/guest.js" defer></script></body></html>
