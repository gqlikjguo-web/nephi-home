<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尼腓的家｜業者後台</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">尼腓的家</p><h1>房況管理</h1></div><button id="logout" class="secondary" hidden>登出</button></header>
<section id="login" class="card login"><h2>業者登入</h2><form id="loginForm"><label>業者代碼<input name="propertyId" value="nephi_home" required autocomplete="organization"></label><label>帳號<input name="username" required autocomplete="username"></label><label>密碼<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">登入</button><p id="loginMessage" class="message" role="alert"></p></form></section>
<section id="calendar" class="card" hidden><div class="toolbar"><div><p class="eyebrow" id="propertyLabel"></p><h2>每月房況</h2></div><label>月份<input id="month" type="month" required></label></div><p class="hint">點選房型即可切換「可售」與「停售」，儲存後 LINE 會立即讀取同一份房況。</p><p id="status" class="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>日期</th><th>301</th><th>302</th><th>401</th><th>402</th></tr></thead><tbody id="days"></tbody></table></div></section></main><script src="/assets/admin.js" defer></script></body></html>
