<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PUBLIC_BRAND_NAME}}｜業者資料填寫</title><link rel="stylesheet" href="/assets/onboarding.css"></head>
<body><main><header><p>{{PUBLIC_BRAND_NAME}}</p><h1>業者資料填寫</h1><p>請依步驟填寫並儲存，送出前可完整預覽。</p><p id="draftStatus">目前狀態：草稿</p><p id="saveFeedback" class="save-feedback" role="status" hidden></p></header><nav id="steps"></nav><form id="form" novalidate>
<section id="changeRequest" hidden><h2>待補件</h2><p id="changeRequestReason"></p><p>請完成修改並重新送出審核。</p></section>
<section data-step><h2>1. 聯絡與民宿基本資料</h2><label>民宿正式名稱<input name="propertyName" required></label><div class="two"><label>聯絡人姓名<input name="contactName" required></label><label>聯絡電話<input name="phone" required></label></div><label>Email<input name="email" type="email" required></label><label>地址<input name="address" required></label><label>Google Maps 網址（選填）<input name="googleMapsUrl" type="url"></label><div class="two"><label>入住時間<select name="checkInTime" required data-time-select></select></label><label>退房時間<select name="checkOutTime" required data-time-select></select></label></div><label><input name="hasOfficialAccount" type="checkbox">目前已有 LINE 官方帳號</label><label>Channel ID（選填）<input name="channelId"></label><label>官方 LINE 加好友網址<input name="contactLink" type="url"></label><p class="hint">只需填寫公開的 LINE 加好友網址，不需提供任何私密憑證。</p></section>
<section data-step hidden><h2>2. 房型與價格</h2><p class="hint">房型顯示名稱、入住人數與房型亮點會顯示在旅客查房頁，請填寫旅客看得懂的內容。價格請依四類日期分別填寫。</p><div id="rooms"></div><button type="button" id="addRoom">新增房型</button></section>
<section data-step hidden><h2>3. 包棟／組合方案</h2><div id="bundles"></div><button type="button" id="addBundle">新增組合方案</button></section>
<section data-step hidden><h2>4. 常見問題與住宿規則</h2><div id="knowledge"></div></section>
<section data-step hidden><h2>5. 送審前預覽</h2><div id="preview"></div><button type="button" id="submit">送出審核</button></section>
<section id="success" hidden><h2 id="successTitle">資料已送出</h2><p id="submittedStatus"></p></section>
<div class="actions"><button type="button" id="previous">上一步</button><button type="button" id="save" class="secondary">儲存草稿</button><button type="button" id="next">下一步</button></div><div id="errors" role="alert"></div><p id="message" role="status"></p></form><footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer></main><script src="/assets/onboarding.js" defer></script></body>
</html>
