<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PUBLIC_BRAND_NAME}}｜業者導入</title><link rel="stylesheet" href="/assets/onboarding.css"></head><body data-public-base-url="{{PUBLIC_BASE_URL}}"><main><header><p>{{PUBLIC_BRAND_NAME}}</p><h1>住宿業者導入</h1><p>建立民宿資料，送出後由平台管理者審核。</p><p id="draftStatus">尚未建立草稿</p></header><nav id="steps"></nav><form id="form">
<section data-step><h2>1. 聯絡與民宿基本資料</h2><label>民宿正式名稱<input name="propertyName" required></label><div class="two"><label>聯絡人姓名<input name="contactName" required></label><label>聯絡電話<input name="phone" required></label></div><label>Email<input name="email" type="email" required></label><label>地址<input name="address" required></label><label>民宿簡短介紹<textarea name="description" required></textarea></label><div class="two"><label>入住時間<input name="checkInTime" type="time" required></label><label>退房時間<input name="checkOutTime" type="time" required></label></div><label><input name="hasOfficialAccount" type="checkbox">目前已有 LINE 官方帳號</label><label>Channel ID<input name="channelId"></label><label>官方 LINE 加好友網址<input name="contactLink" type="url"></label><p class="hint">Channel Secret 與 Channel Access Token 將在核准後由平台管理者安全設定，本表單不蒐集。</p></section>
<section data-step hidden><h2>2. 房型資料</h2><div id="rooms"></div><button type="button" id="addRoom">新增房型</button></section>
<section data-step hidden><h2>3. 包棟或組合方案</h2><div id="bundles"></div><button type="button" id="addBundle">新增組合方案</button></section>
<section data-step hidden><h2>4. 初始房況來源</h2><label>來源<select name="availabilityType"><option value="none">目前沒有其他系統，稍後自行設定</option><option value="csv">上傳 CSV</option><option value="excel">上傳 Excel</option><option value="ics">上傳 ICS / iCal</option><option value="system">提供現有系統名稱</option><option value="screenshot">上傳截圖或報表待人工審查</option></select></label><label>現有系統名稱<input name="systemName"></label><label>附件<input id="attachment" type="file" accept=".csv,.xlsx,.xls,.ics,.ical,.png,.jpg,.jpeg,.pdf"></label><button type="button" id="upload">上傳附件</button><ul id="attachments"></ul><p class="hint">附件只保存供審核。截圖與報表不會自動寫入正式房況。</p></section>
<section data-step hidden><h2>5. 常用自動回覆資料</h2><div id="knowledge"></div></section>
<section data-step hidden><h2>6. 預覽與送出</h2><pre id="preview"></pre><button type="button" id="submit">送出審核</button></section>
<div class="actions"><button type="button" id="previous">上一步</button><button type="button" id="save">儲存草稿</button><button type="button" id="next">下一步</button></div><p id="message" role="status"></p></form><footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer></main><script src="/assets/onboarding.js" defer></script></body></html>
