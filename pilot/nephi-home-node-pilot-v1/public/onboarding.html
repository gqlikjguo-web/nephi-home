<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{PUBLIC_BRAND_NAME}}｜業者導入</title><link rel="stylesheet" href="/assets/onboarding.css"></head><body><main><header><p>{{PUBLIC_BRAND_NAME}}</p><h1>住宿業者導入</h1><p>分步填寫並儲存草稿，送出後由平台管理者審核。</p><p id="draftStatus">尚未建立草稿</p></header><nav id="steps"></nav><form id="form" novalidate>
<section data-step><h2>1. 聯絡與民宿基本資料</h2><label>民宿正式名稱<input name="propertyName" required></label><div class="two"><label>聯絡人姓名<input name="contactName" required></label><label>聯絡電話<input name="phone" required></label></div><label>Email<input name="email" type="email" required></label><label>地址<input name="address" required></label><div class="two"><label>入住時間<select name="checkInTime" required data-time-select></select></label><label>退房時間<select name="checkOutTime" required data-time-select></select></label></div><label><input name="hasOfficialAccount" type="checkbox">目前已有 LINE 官方帳號</label><label>Channel ID<input name="channelId"></label><label>官方 LINE 加好友網址<input name="contactLink" type="url"></label><p class="hint">本表單不蒐集 Channel Secret 或 Token。</p></section>
<section data-step hidden><h2>2. 房型與價格</h2><p class="hint">價格以元計。每個房型填寫四類售價。</p><div id="rooms"></div><button type="button" id="addRoom">新增房型</button></section>
<section data-step hidden><h2>3. 包棟或組合方案</h2><div id="bundles"></div><button type="button" id="addBundle">新增組合方案</button></section>
<section data-step hidden><h2>4. 常用自動回覆與設施</h2><div id="knowledge"></div></section>
<section data-step hidden><h2>5. 預覽與送出</h2><div id="preview"></div><button type="button" id="submit">送出審核</button></section>
<section id="success" hidden><h2>資料已送出，正在等待平台審核</h2><p id="submittedStatus">目前狀態：待審核</p></section>
<div class="actions"><button type="button" id="previous">上一步</button><button type="button" id="save">儲存草稿</button><button type="button" id="next">下一步</button></div><div id="errors" role="alert"></div><p id="message" role="status"></p></form><footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer></main><script src="/assets/onboarding.js" defer></script></body></html>
