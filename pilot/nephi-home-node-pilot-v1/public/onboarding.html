<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業者導入</title><link rel="stylesheet" href="/assets/onboarding.css"></head><body><main><header><p>住宿業者導入</p><h1>建立民宿資料</h1><p id="draftStatus">尚未建立草稿</p></header><nav id="steps"></nav><form id="form">
<section data-step="0"><h2>1. 基本資料</h2><label>民宿正式名稱<input name="propertyName" required></label><label>聯絡人姓名<input name="contactName" required></label><label>聯絡電話<input name="phone" required></label><label>Email<input name="email" type="email" required></label><label>地址<input name="address" required></label><label>民宿簡短介紹<textarea name="description"></textarea></label><div class="two"><label>入住時間<input name="checkInTime" type="time" required></label><label>退房時間<input name="checkOutTime" type="time" required></label></div><label><input name="hasOfficialAccount" type="checkbox"> 已有 LINE 官方帳號</label><label>Channel ID<input name="channelId"></label><label>官方 LINE 加好友網址<input name="contactLink" type="url"></label><p class="hint">Channel Secret 與 Access Token 不在此表單收集，核准後由平台管理者安全設定。</p></section>
<section data-step="1" hidden><h2>2. 房型</h2><div id="rooms"></div><button type="button" id="addRoom">新增房型</button></section>
<section data-step="2" hidden><h2>3. 包棟／組合方案</h2><div id="bundles"></div><button type="button" id="addBundle">新增組合方案</button></section>
<section data-step="3" hidden><h2>4. 初始房況</h2><label>房況來源<select name="availabilityType"><option value="none">目前沒有其他系統，稍後自行設定</option><option value="csv">上傳 CSV</option><option value="excel">上傳 Excel</option><option value="ical">上傳 ICS / iCal</option><option value="system">提供現有系統名稱</option><option value="attachment">上傳截圖或報表待審</option></select></label><label>現有系統名稱<input name="systemName"></label><label>附件<input id="attachment" type="file" accept=".csv,.xls,.xlsx,.ics,.ical,.png,.jpg,.jpeg,.pdf"></label><button type="button" id="upload">上傳附件</button><ul id="attachments"></ul></section>
<section data-step="4" hidden><h2>5. 常用自動回覆</h2><p class="hint">每題可選固定答案、不提供、需轉真人或尚未確定。</p><div id="knowledge"></div></section>
<section data-step="5" hidden><h2>6. 預覽與送出</h2><div id="preview"></div><p>送出後狀態為「待審核」，不會直接建立正式 property。</p><button type="button" id="submit">送出審核</button></section>
<p id="message" role="status"></p><div class="actions"><button type="button" id="previous">上一步</button><button type="button" id="save">儲存草稿</button><button type="button" id="next">下一步</button></div></form></main><script src="/assets/onboarding.js" defer></script></body></html>
