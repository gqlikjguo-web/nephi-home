<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PUBLIC_BRAND_NAME}}｜業者導入審核</title>
  <link rel="stylesheet" href="/assets/onboarding.css">
  <link rel="stylesheet" href="/assets/admin-onboarding.css">
</head>
<body class="admin-review" data-public-base-url="{{PUBLIC_BASE_URL}}">
  <main>
    <header>
      <p>{{PUBLIC_BRAND_NAME}}</p>
      <h1>業者導入審核</h1>
      <p>此頁沿用已登入的業者後台 session，且需要平台管理者授權。</p>
      <p><a href="/admin/platform">返回平台總後台</a></p>
    </header>
    <section class="invite-panel">
      <h2>建立友好業者邀請</h2>
      <p>邀請只建立 onboarding 草稿，不會建立正式旅宿、啟用自動回覆或綁定 LINE。</p>
      <label>有效天數
        <select id="inviteDays">
          <option value="3">3 天</option>
          <option value="7" selected>7 天</option>
          <option value="14">14 天</option>
          <option value="30">30 天</option>
        </select>
      </label>
      <button id="createInvite" type="button">建立並複製邀請連結</button>
      <p id="inviteResult" role="status"></p>
    </section>
    <section>
      <div id="filterStatus" class="filter-status" hidden>
        <strong id="filterLabel"></strong>
        <a href="/admin/onboarding">顯示全部</a>
      </div>
      <button id="refresh" type="button">重新整理</button>
      <div id="applications"></div>
      <p id="message" tabindex="-1" aria-live="polite"></p>
    </section>
    <footer><small>© {{PUBLIC_BRAND_NAME}}</small></footer>
  </main>
  <script src="/assets/admin-onboarding.js" defer></script>
</body>
</html>
